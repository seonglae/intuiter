name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare release assets (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          mv dmg/*.dmg ../../../Intuiter_${{ steps.version.outputs.version }}_${{ matrix.name }}.dmg

      - name: Prepare release assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          mv appimage/*.AppImage ../../../Intuiter_${{ steps.version.outputs.version }}_${{ matrix.name }}.AppImage
          mv deb/*.deb ../../../Intuiter_${{ steps.version.outputs.version }}_${{ matrix.name }}.deb

      - name: Prepare release assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          mv nsis/*.exe ../../../Intuiter_${{ steps.version.outputs.version }}_${{ matrix.name }}.exe
          mv msi/*.msi ../../../Intuiter_${{ steps.version.outputs.version }}_${{ matrix.name }}.msi

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/Intuiter_*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
